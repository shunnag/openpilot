{
  "name": "Kernel and wpa_supplicant follow",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "replay": {
          "description": "Optional replay: 19.8, 19.9, neg-caff1d8d, or latest. Any nonempty replay forces dryrun.",
          "type": "string",
          "default": ""
        },
        "branch": {
          "description": "Upstream discovery scope (ignored for replay)",
          "type": "choice",
          "default": "all",
          "options": [
            "all",
            "nightly",
            "nightly-chestnut",
            "release-mici-staging",
            "release-tizi-staging"
          ]
        },
        "force": {
          "description": "Bypass only the younger-than-seven-days held-attempt skip",
          "type": "boolean",
          "default": false
        },
        "wpa_reference": {
          "description": "Rebuild and test the known 0.4 reference even when G8 is seeded (no publishing).",
          "type": "boolean",
          "default": false
        },
        "wpa_result_id": {
          "description": "Optional public Mac mini result id; must match all rebuilt asset hashes and suite commit. Empty = T3 PENDING.",
          "type": "string",
          "default": ""
        },
        "reason": {
          "description": "Reason for this follow request",
          "type": "string",
          "default": ""
        }
      }
    },
    "schedule": [
      {
        "cron": "17 10 * * *"
      }
    ]
  },
  "permissions": {},
  "env": {
    "FOLLOW_MODE": "${{ vars.WPA3_FOLLOW_MODE || 'off' }}",
    "GIT_LFS_SKIP_SMUDGE": "1",
    "GIT_LFS_SKIP_PUSH": "1",
    "GIT_TERMINAL_PROMPT": "0",
    "FOLLOW_BRANCHES": "${{ vars.WPA3_FOLLOW_BRANCHES }}"
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "detect": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read"
      },
      "outputs": {
        "matrix": "${{ steps.detect.outputs.matrix }}",
        "build": "${{ steps.detect.outputs.build }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Discover and run K0-K4(f)",
          "id": "detect",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "REPLAY": "${{ inputs.replay }}",
            "BRANCH": "${{ inputs.branch }}",
            "FORCE": "${{ inputs.force }}"
          },
          "run": "flags=()\nif [[ \"$FORCE\" == true ]]; then flags+=(--force); fi\nmkdir -p detect\npython3 scripts/kernel_follow.py detect --out detect --replay \"$REPLAY\" --mode \"$FOLLOW_MODE\" --branch \"${BRANCH:-all}\" \"${flags[@]}\" 2>&1 | tee detect.log"
        },
        {
          "name": "Detect summary",
          "if": "always()",
          "run": "{\n  echo '### Kernel follow detection'\n  echo '```text'\n  cat detect.log || true\n  echo '```'\n} >> \"$GITHUB_STEP_SUMMARY\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "kernel-detect",
            "path": "detect/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "kernel-build": {
      "needs": "detect",
      "if": "needs.detect.outputs.build == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 150,
      "permissions": {
        "contents": "read"
      },
      "strategy": {
        "fail-fast": false,
        "max-parallel": 3,
        "matrix": "${{ fromJSON(needs.detect.outputs.matrix) }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "kernel-detect",
            "path": "detect"
          }
        },
        {
          "name": "Free disk and choose build volume",
          "run": "sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL\ndocker system prune -af\nbuild_root=\"$RUNNER_TEMP/kernel-follow\"\nif [[ -d /mnt ]] && (( $(df -Pk /mnt | awk 'END {print $4}') > $(df -Pk \"$RUNNER_TEMP\" | awk 'END {print $4}') )); then\n  build_root=/mnt/kernel-follow\n  sudo systemctl stop docker\n  sudo mkdir -p /mnt/docker\n  sudo python3 - <<'PYCODE'\nimport json\nfrom pathlib import Path\npath = Path('/etc/docker/daemon.json')\nconfig = json.loads(path.read_text()) if path.exists() else {}\nconfig['data-root'] = '/mnt/docker'\npath.parent.mkdir(parents=True, exist_ok=True)\npath.write_text(json.dumps(config))\nPYCODE\n  sudo systemctl start docker\nfi\nsudo mkdir -p \"$build_root\"\nsudo chown \"$(id -u):$(id -g)\" \"$build_root\"\necho \"BUILD_WORK=$build_root/work\" >> \"$GITHUB_ENV\"\necho \"TOOLCHAIN_TAR=$RUNNER_TEMP/gcc-arm-8.2.tar.xz\" >> \"$GITHUB_ENV\"\ndf -h"
        },
        {
          "name": "Toolchain policy",
          "id": "toolchain",
          "run": "python3 - <<'PYCODE'\nimport json, os\npolicy = json.load(open('follow/policy.json'))['toolchain']\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as out:\n  out.write('sha256=' + policy['sha256'] + '\\n')\n  out.write('url=' + policy['url'] + '\\n')\nPYCODE"
        },
        {
          "uses": "actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684",
          "id": "cache",
          "with": {
            "path": "${{ env.TOOLCHAIN_TAR }}",
            "key": "gcc-arm-8.2-2018.08-x86_64-aarch64-${{ steps.toolchain.outputs.sha256 }}"
          }
        },
        {
          "name": "Download if absent; verify even on a cache hit",
          "env": {
            "TOOLCHAIN_URL": "${{ steps.toolchain.outputs.url }}",
            "TOOLCHAIN_SHA256": "${{ steps.toolchain.outputs.sha256 }}"
          },
          "run": "if [[ ! -f \"$TOOLCHAIN_TAR\" ]]; then\n  curl --fail --location --retry 3 --output \"$TOOLCHAIN_TAR\" \"$TOOLCHAIN_URL\"\nfi\nprintf '%s  %s\\n' \"$TOOLCHAIN_SHA256\" \"$TOOLCHAIN_TAR\" | sha256sum --check --status"
        },
        {
          "uses": "actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684",
          "if": "steps.cache.outputs.cache-hit != 'true'",
          "with": {
            "path": "${{ env.TOOLCHAIN_TAR }}",
            "key": "gcc-arm-8.2-2018.08-x86_64-aarch64-${{ steps.toolchain.outputs.sha256 }}"
          }
        },
        {
          "name": "Host-only git and exports before compiling",
          "env": {
            "CANDIDATE_ID": "${{ matrix.id }}"
          },
          "run": "python3 scripts/kernel_build_data.py prepare --inputs detect --id \"$CANDIDATE_ID\" --work \"$BUILD_WORK\""
        },
        {
          "name": "Stock rebuild then incremental WPA3",
          "id": "compile",
          "run": "mkdir -p \"$BUILD_WORK/artifacts\"\nmetrics=\"$BUILD_WORK/artifacts/metrics.txt\"\nprintf 'start_utc=%s\\n' \"$(date -u +%FT%TZ)\" >> \"$metrics\"\nstart=$SECONDS\n(while true; do date -u +%FT%TZ; df -Pk \"$BUILD_WORK\"; sleep 5; done) >> \"$metrics\" &\nmonitor=$!\ntrap 'kill \"$monitor\" 2>/dev/null || true; wait \"$monitor\" 2>/dev/null || true' EXIT\nresult=failed\nif bash scripts/kernel_build.sh stock \"$BUILD_WORK\" \"$TOOLCHAIN_TAR\" 2>&1 | tee \"$BUILD_WORK/artifacts/build.log\"; then\n  if bash scripts/kernel_build.sh wpa3 \"$BUILD_WORK\" \"$TOOLCHAIN_TAR\" 2>&1 | tee -a \"$BUILD_WORK/artifacts/build.log\"; then\n    result=complete\n  fi\nelif [[ -f \"$BUILD_WORK/artifacts/stock-rebuild-report.txt\" ]]; then\n  result=rejected\nfi\nprintf 'end_utc=%s\\nwall_seconds=%s\\n' \"$(date -u +%FT%TZ)\" \"$((SECONDS-start))\" >> \"$metrics\"\necho \"result=$result\" >> \"$GITHUB_OUTPUT\"\n# A rejected source is an expected candidate result; publish rechecks K5.\n[[ \"$result\" != failed ]]"
        },
        {
          "name": "Seal data artifacts and free rejected source",
          "if": "always()",
          "env": {
            "BUILD_RESULT": "${{ steps.compile.outputs.result || 'failed' }}"
          },
          "run": "count=0\nif [[ -f \"$BUILD_WORK/full-builds\" ]]; then count=$(cat \"$BUILD_WORK/full-builds\"); fi\npython3 scripts/kernel_build_data.py finalize --work \"$BUILD_WORK\" --result \"$BUILD_RESULT\" --count \"$count\"\nif [[ \"$BUILD_RESULT\" != complete ]]; then rm -rf \"$BUILD_WORK/source\" \"$BUILD_WORK/patch-files\"; fi"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "kernel-${{ matrix.id }}",
            "path": "${{ env.BUILD_WORK }}/artifacts/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "publish": {
      "needs": [
        "detect",
        "kernel-build",
        "probe",
        "wpa-classify",
        "wpa-build",
        "wpa-test"
      ],
      "if": "always() && needs.detect.result == 'success' && needs.probe.result == 'success'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "permissions": {
        "contents": "write",
        "issues": "write",
        "actions": "write"
      },
      "concurrency": {
        "group": "wpa3-state",
        "queue": "max",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "ref": "wpa3-ci"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "kernel-detect",
            "path": "detect"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "wpa-probe",
            "path": "probe"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "if": "needs.detect.outputs.build == 'true'",
          "with": {
            "pattern": "kernel-*-*",
            "path": "builds"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "if": "needs.probe.outputs.build == 'true' && needs.wpa-test.result == 'success'",
          "with": {
            "pattern": "wpa-request-*",
            "path": "wpa-requests"
          }
        },
        {
          "name": "Verify and write under the owner mode switch",
          "if": "(env.FOLLOW_MODE == 'state' || env.FOLLOW_MODE == 'on') && inputs.replay == '' && inputs.wpa_reference != true",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "GH_REPO": "${{ github.repository }}"
          },
          "run": "gh auth setup-git --hostname github.com\npython3 scripts/follow_publish.py --inputs detect --builds builds --probes probe --wpa-builds wpa-requests --out verified 2>&1 | tee publish.log"
        },
        {
          "name": "Verify replay or dry mode without remote writes",
          "if": "${{ !((env.FOLLOW_MODE == 'state' || env.FOLLOW_MODE == 'on') && inputs.replay == '' && inputs.wpa_reference != true) }}",
          "run": "python3 scripts/follow_publish.py --inputs detect --builds builds --probes probe --wpa-builds wpa-requests --out verified 2>&1 | tee publish.log"
        },
        {
          "name": "Follow summary",
          "if": "always()",
          "run": "{\n  echo '### Follow verification and publication'\n  echo '```text'\n  cat publish.log || true\n  echo '```'\n  echo 'Kernel pins require on; state permits probes and drafts. Replays never write.'\n  echo 'Q8/Q10: queue:max and live GitHub write semantics still require the sandbox run.'\n} >> \"$GITHUB_STEP_SUMMARY\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "kernel-verified",
            "path": "verified/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ],
      "env": {
        "FOLLOW_MODE": "${{ vars.WPA3_FOLLOW_MODE || 'off' }}",
        "REPLAY": "${{ inputs.replay }}",
        "RESULT_ID": "${{ inputs.wpa_result_id }}",
        "WPA_REFERENCE": "${{ inputs.wpa_reference }}"
      }
    },
    "probe": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Probe distinct system images; leave seeded hashes cached",
          "id": "probe",
          "env": {
            "REPLAY": "${{ inputs.replay }}",
            "REFERENCE": "${{ inputs.wpa_reference }}"
          },
          "run": "flags=()\nif [[ \"$REFERENCE\" == true ]]; then flags+=(--reference); fi\npython3 scripts/wpa_follow.py probe --out probe --replay \"$REPLAY\" --mode \"$FOLLOW_MODE\" \"${flags[@]}\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "wpa-probe",
            "path": "probe/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ],
      "outputs": {
        "matrix": "${{ steps.probe.outputs.matrix }}",
        "build": "${{ steps.probe.outputs.build }}"
      }
    },
    "wpa-classify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "wpa-probe",
            "path": "probe"
          }
        },
        {
          "name": "W1\u2013W3 from signed Ubuntu indices",
          "env": {
            "ITEM_ID": "${{ matrix.id }}"
          },
          "run": "sudo apt-get update\nsudo apt-get install -y ubuntu-keyring gnupg zstd\npython3 scripts/wpa_follow.py classify --inputs probe --id \"$ITEM_ID\" --out classified"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "wpa-classified-${{ matrix.id }}",
            "path": "classified/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ],
      "needs": [
        "probe"
      ],
      "if": "needs.probe.outputs.build == 'true'",
      "strategy": {
        "fail-fast": false,
        "max-parallel": 2,
        "matrix": "${{ fromJSON(needs.probe.outputs.matrix) }}"
      }
    },
    "wpa-build": {
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 90,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "wpa-classified-${{ matrix.id }}",
            "path": "classified"
          }
        },
        {
          "name": "Pinned native arm64 build twice; P1/P2/R1",
          "run": "python3 scripts/wpa_follow.py build --inputs classified --out built"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "wpa-built-${{ matrix.id }}",
            "path": "built/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ],
      "needs": [
        "probe",
        "wpa-classify"
      ],
      "if": "needs.probe.outputs.build == 'true'",
      "strategy": {
        "fail-fast": false,
        "max-parallel": 2,
        "matrix": "${{ fromJSON(needs.probe.outputs.matrix) }}"
      }
    },
    "wpa-test": {
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "wpa-built-${{ matrix.id }}",
            "path": "built"
          }
        },
        {
          "name": "T0\u2013T2 against the verified read-only AGNOS image",
          "run": "sudo apt-get update\nsudo apt-get install -y e2fsprogs binutils wpasupplicant zstd\npython3 scripts/wpa_follow.py test --inputs built"
        },
        {
          "name": "Write test-request.json for guarded draft publication",
          "env": {
            "SUITE_COMMIT": "${{ github.sha }}",
            "RUN_ID": "${{ github.run_id }}"
          },
          "run": "python3 scripts/wpa_follow.py request --inputs built --suite-commit \"$SUITE_COMMIT\" --run-id \"$RUN_ID\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "wpa-request-${{ matrix.id }}",
            "path": "built/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ],
      "needs": [
        "probe",
        "wpa-build"
      ],
      "if": "needs.probe.outputs.build == 'true'",
      "strategy": {
        "fail-fast": false,
        "max-parallel": 2,
        "matrix": "${{ fromJSON(needs.probe.outputs.matrix) }}"
      }
    },
    "report": {
      "needs": [
        "detect",
        "probe",
        "kernel-build",
        "wpa-classify",
        "wpa-build",
        "wpa-test",
        "publish"
      ],
      "if": "always() && contains(needs.*.result, 'failure') && (vars.WPA3_FOLLOW_MODE == 'state' || vars.WPA3_FOLLOW_MODE == 'on') && inputs.replay == '' && inputs.wpa_reference != true",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "issues": "write"
      },
      "steps": [
        {
          "name": "Report failed follow run",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "GH_REPO": "${{ github.repository }}",
            "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          },
          "run": "gh label create follow-hold --repo \"$GH_REPO\" --color B60205 --force\nprintf 'Follow failed. Inspect the gates and publication log: %s\\n' \"$RUN_URL\" > \"$RUNNER_TEMP/follow-failure.md\"\ngh issue create --repo \"$GH_REPO\" --label follow-hold --title \"WPA3 follow failed: $GITHUB_RUN_ID\" --body-file \"$RUNNER_TEMP/follow-failure.md\""
        }
      ]
    }
  }
}
