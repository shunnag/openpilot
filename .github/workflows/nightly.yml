name: Nightly WPA3
run-name: "Nightly WPA3 (follow mode: ${{ vars.WPA3_FOLLOW_MODE || 'off' }})"

on:
  schedule:
    - cron: '7 11 * * *'
    - cron: '43 12 * * *'
  workflow_dispatch:
    inputs:
      upstream:
        description: Compose latest upstream or the published upstream for withdrawal
        type: choice
        options: [latest, published]
        default: latest
      force:
        description: Run gates and compose even if inputs are unchanged
        type: boolean
        default: false

permissions: {}

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_LFS_SKIP_PUSH: '1'
  GIT_TERMINAL_PROMPT: '0'
  GH_TOKEN: ${{ github.token }}
  WPA3_FOLLOW_MODE: ${{ vars.WPA3_FOLLOW_MODE || 'off' }}
  GH_REPO: ${{ github.repository }}

jobs:
  publish:
    permissions:
      contents: write
      issues: write
    outputs:
      pending_nightly: ${{ steps.pin.outputs.pending_nightly }}
      pending_nightly_chestnut: ${{ steps.pin.outputs.pending_nightly_chestnut }}
      pending_release_mici_staging: ${{ steps.pin.outputs.pending_release_mici_staging }}
      pending_release_tizi_staging: ${{ steps.pin.outputs.pending_release_tizi_staging }}
    concurrency:
      group: publish
      queue: max
      cancel-in-progress: false
    env:
      UPSTREAM_SOURCE: ${{ inputs.upstream || 'latest' }}
      FORCE: ${{ inputs.force || false }}
      OWNER: ${{ github.repository_owner }}
      BRANCHES: 'nightly nightly-chestnut release-mici-staging release-tizi-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: wpa3-ci
          lfs: false
          submodules: false
          persist-credentials: false

      - name: Initialise shared bare repository
        id: setup
        run: |
          echo "ci_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gh auth setup-git --hostname github.com
          BARE_REPO="$RUNNER_TEMP/wpa3.git"
          echo "BARE_REPO=$BARE_REPO" >> "$GITHUB_ENV"
          git init --bare "$BARE_REPO"
          git -C "$BARE_REPO" remote add origin "https://github.com/$GH_REPO.git"

      - name: Publish branches sequentially
        id: pin
        env:
          WPA3_CI_HEAD: ${{ steps.setup.outputs.ci_head }}
        run: |
          failed=0
          for BRANCH in $BRANCHES; do
            echo "::group::$BRANCH"
            if (export BRANCH; bash -eu -o pipefail scripts/publish_branch.sh); then
              rc=0
            else
              rc=$?
              failed=1
            fi
            result=$(cat "$RUNNER_TEMP/$BRANCH/result" 2>/dev/null || echo "failed ($rc)")
            echo "$BRANCH: $result"
            echo "- $BRANCH: $result" >> "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          done
          exit "$failed"

  request-follow:
    needs: publish
    if: always()
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request follow once for all pending branches
        if: needs.publish.outputs.pending_nightly == 'true' || needs.publish.outputs.pending_nightly_chestnut == 'true' || needs.publish.outputs.pending_release_mici_staging == 'true' || needs.publish.outputs.pending_release_tizi_staging == 'true'
        run: gh workflow run follow.yml --ref wpa3-ci --repo "$GH_REPO" -f reason=nightly-pending
